<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seminar Beheerportaal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      margin-top: 20px;
    }
    h1 { font-size: 20px; color: #1a202c; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #718096; margin-bottom: 20px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1a202c;
      margin-bottom: 6px;
    }
    input, textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      margin-bottom: 16px;
      color: #1a202c;
    }
    input:focus, textarea:focus { border-color: #1a56db; }
    textarea { resize: vertical; min-height: 90px; }

    .btn {
      width: 100%;
      padding: 13px;
      background: #1a56db;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.8; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.green { background: #38a169; }

    .result {
      margin-top: 12px; padding: 10px 14px; border-radius: 8px;
      font-size: 13px; display: none; white-space: pre-wrap;
    }
    .result.ok { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
    .result.err { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }

    .divider { border: none; border-top: 1px solid #e2e8f0; margin: 24px 0; }

    .scans-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .scans-title { font-size: 17px; font-weight: 700; color: #1a202c; }
    .scans-refresh {
      background: none; border: 1px solid #e2e8f0; border-radius: 8px;
      padding: 6px 12px; font-size: 13px; cursor: pointer; color: #718096;
    }
    .scans-refresh:active { opacity: 0.7; }

    .scan-card {
      background: white; border: 1px solid #e2e8f0; border-radius: 12px;
      padding: 14px; margin-bottom: 12px;
    }
    .scan-card.financial { border-color: #f6ad55; }
    .scan-card-header { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
    .scan-thumb { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
    .scan-meta { flex: 1; min-width: 0; }
    .scan-time { font-size: 11px; color: #718096; margin-bottom: 4px; }
    .scan-del-btn {
      background: none; border: none; color: #ccc; font-size: 20px;
      cursor: pointer; padding: 0; flex-shrink: 0;
    }
    .scan-del-btn:active { color: #e53e3e; }

    .financial-box {
      background: #fffbeb; border: 1px solid #f6e05e; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 10px;
    }
    .financial-box .fb-label {
      font-size: 11px; font-weight: 700; color: #b7791f;
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
    }
    .financial-box table { width: 100%; font-size: 13px; border-collapse: collapse; }
    .financial-box td { padding: 2px 0; vertical-align: top; }
    .financial-box .fb-key { color: #718096; width: 110px; }
    .financial-box .fb-amount { font-weight: 700; color: #e53e3e; font-size: 15px; }

    .scan-text-preview {
      font-size: 12px; color: #718096; line-height: 1.5;
      overflow: hidden; display: -webkit-box;
      -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    }
    .scans-empty { text-align: center; padding: 32px; color: #718096; font-size: 14px; }

    .config-toggle {
      background: none; border: none; color: #718096; font-size: 13px;
      cursor: pointer; text-decoration: underline; padding: 0; margin-bottom: 16px;
    }
    .config-section { display: none; }
    .config-section.open { display: block; }
    .config-hint { font-size: 11px; color: #718096; margin-top: -12px; margin-bottom: 14px; line-height: 1.5; }
  </style>
</head>
<body>

<div class="card">
  <h1>📣 Beheerportaal</h1>
  <p class="sub">Stuur een pushbericht naar alle deelnemers</p>

  <label>Bericht</label>
  <textarea id="message" placeholder="Typ hier je bericht voor de deelnemers…"></textarea>

  <button class="btn" id="send-btn" onclick="sendNotification()">Verstuur push notificatie</button>
  <div class="result" id="send-result"></div>

  <hr class="divider">

  <div class="scans-header">
    <span class="scans-title">📄 Gescande documenten</span>
    <button class="scans-refresh" onclick="loadScans()">↻ Vernieuwen</button>
  </div>
  <div id="scans-list"></div>

  <hr class="divider">

  <button class="config-toggle" onclick="toggleConfig()">⚙️ Instellingen</button>
  <div class="config-section" id="config-section">
    <label>Cloudflare Worker URL</label>
    <input type="url" id="worker-url" placeholder="https://seminar-push.naam.workers.dev" />

    <label>Admin sleutel</label>
    <input type="password" id="admin-key" placeholder="Je ADMIN_KEY uit Cloudflare" />
    <p class="config-hint">Worden alleen lokaal opgeslagen in je browser.</p>

    <button class="btn green" onclick="saveConfig()">Opslaan</button>
    <div class="result" id="config-result"></div>
  </div>
</div>

<script>
  function load() {
    document.getElementById('worker-url').value = localStorage.getItem('admin-worker-url') || '';
    document.getElementById('admin-key').value = localStorage.getItem('admin-key') || '';
    loadScans();
  }

  async function sendNotification() {
    const message = document.getElementById('message').value.trim();
    const workerUrl = localStorage.getItem('admin-worker-url');
    const adminKey = localStorage.getItem('admin-key');

    if (!message) { showResult('send-result', 'Vul een bericht in.', false); return; }
    if (!workerUrl || !adminKey) {
      showResult('send-result', 'Open eerst de instellingen en vul de Worker URL en admin sleutel in.', false);
      document.getElementById('config-section').classList.add('open');
      return;
    }

    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    btn.textContent = 'Versturen…';

    try {
      const resp = await fetch(`${workerUrl}/notify`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminKey}` },
        body: JSON.stringify({ message }),
      });
      if (!resp.ok) throw new Error(`${resp.status}: ${await resp.text()}`);
      const data = await resp.json();
      let msg = `✓ Verstuurd naar ${data.sent} deelnemer${data.sent !== 1 ? 's' : ''}`;
      if (data.failed) msg += ` (${data.failed} mislukt)`;
      showResult('send-result', msg, true);
      if (data.sent > 0) document.getElementById('message').value = '';
    } catch (err) {
      showResult('send-result', 'Fout: ' + err.message, false);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Verstuur push notificatie';
    }
  }

  async function loadScans() {
    const workerUrl = localStorage.getItem('admin-worker-url');
    const adminKey = localStorage.getItem('admin-key');
    const el = document.getElementById('scans-list');
    if (!workerUrl || !adminKey) {
      el.innerHTML = '<p class="scans-empty">Stel eerst de Worker URL en admin sleutel in via ⚙️ instellingen.</p>';
      return;
    }
    el.innerHTML = '<p class="scans-empty">Laden…</p>';
    try {
      const resp = await fetch(`${workerUrl}/scans`, {
        headers: { 'Authorization': `Bearer ${adminKey}` }
      });
      if (!resp.ok) throw new Error(resp.status);
      renderScans(await resp.json());
    } catch (e) {
      el.innerHTML = `<p class="scans-empty">Kon scans niet laden: ${e.message}</p>`;
    }
  }

  function renderScans(scans) {
    const el = document.getElementById('scans-list');
    if (!scans.length) { el.innerHTML = '<p class="scans-empty">Nog geen gescande documenten.</p>'; return; }
    el.innerHTML = scans.map(s => {
      const st = s.structured || {};
      const isFinancial = st.is_financial && (st.debt_amount || st.creditor_name);
      const financialHtml = isFinancial ? `
        <div class="financial-box">
          <div class="fb-label">💰 Financiële gegevens</div>
          <table>
            <tr><td class="fb-key">Schuldeiser</td><td><strong>${esc(st.creditor_name || '—')}</strong></td></tr>
            <tr><td class="fb-key">Adres</td><td>${esc(st.creditor_address || '—')}</td></tr>
            <tr><td class="fb-key">Contact</td><td>${esc(st.creditor_contact || '—')}</td></tr>
            <tr><td class="fb-key">Openst. schuld</td><td class="fb-amount">${esc(st.debt_amount || '—')}</td></tr>
            <tr><td class="fb-key">Vervaldatum</td><td>${esc(st.due_date || '—')}</td></tr>
            <tr><td class="fb-key">Referentie</td><td>${esc(st.reference || '—')}</td></tr>
            <tr><td class="fb-key">Rekening</td><td style="font-family:monospace">${esc(st.iban || '—')}</td></tr>
          </table>
        </div>` : '';
      const scanKey = (s._key || s.id || '').replace('scan-', '');
      return `
        <div class="scan-card ${isFinancial ? 'financial' : ''}">
          <div class="scan-card-header">
            ${s.img ? `<img class="scan-thumb" src="${s.img}" alt="">` : ''}
            <div class="scan-meta">
              <div class="scan-time">${new Date(s.time).toLocaleString('nl-NL', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
              <div style="font-size:13px;color:#1a202c;">${esc(st.summary || s.text?.slice(0,60) || '')}</div>
            </div>
            <button class="scan-del-btn" onclick="deleteScan('${scanKey}', this)">✕</button>
          </div>
          ${financialHtml}
          <div class="scan-text-preview">${esc(s.text || '')}</div>
        </div>`;
    }).join('');
  }

  async function deleteScan(key, btn) {
    const workerUrl = localStorage.getItem('admin-worker-url');
    const adminKey = localStorage.getItem('admin-key');
    btn.closest('.scan-card').style.opacity = '0.4';
    await fetch(`${workerUrl}/scan/${key}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${adminKey}` }
    }).catch(() => {});
    loadScans();
  }

  function esc(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function saveConfig() {
    localStorage.setItem('admin-worker-url', document.getElementById('worker-url').value.trim().replace(/\/$/, ''));
    localStorage.setItem('admin-key', document.getElementById('admin-key').value.trim());
    showResult('config-result', '✓ Instellingen opgeslagen', true);
    setTimeout(toggleConfig, 1500);
    loadScans();
  }

  function toggleConfig() {
    document.getElementById('config-section').classList.toggle('open');
  }

  function showResult(id, msg, ok) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = 'result ' + (ok ? 'ok' : 'err');
    el.style.display = 'block';
    if (ok) setTimeout(() => el.style.display = 'none', 4000);
  }

  load();
</script>
</body>
</html>
