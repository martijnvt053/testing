<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fincent — Inloggen</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #4338ca;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
    }
    .logo svg { width: 52px; height: 52px; }
    .logo-name {
      font-size: 38px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 44px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.22);
    }
    h1 {
      font-size: 22px;
      font-weight: 500;
      color: #1a1a2e;
      text-align: center;
      margin-bottom: 28px;
    }
    .field { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 6px;
    }
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      color: #1a1a2e;
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
    }
    input[type="email"]:focus,
    input[type="password"]:focus,
    input[type="text"]:focus { border-color: #4338ca; }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 54px; }
    .pw-eye {
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 50px;
      background: #ede9fe;
      border: none;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .pw-eye:hover { background: #ddd6fe; }
    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 6px 0 26px;
    }
    .check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #6b7280;
      cursor: pointer;
      user-select: none;
    }
    .check-label input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
    .forgot { font-size: 14px; color: #4338ca; text-decoration: none; }
    .forgot:hover { text-decoration: underline; }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: #312e81;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-login:hover:not(:disabled) { background: #3730a3; }
    .btn-login:active:not(:disabled) { background: #1e1b4b; }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
    .error-box {
      background: #fee2e2;
      color: #dc2626;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 38 C6 38 14 16 23 26 C32 36 40 14 48 14"
            stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <span class="logo-name">Fincent</span>
  </div>

  <div class="card">
    <h1>Inloggen met je account</h1>
    <div class="error-box" id="err"></div>
    <form id="form" onsubmit="doLogin(event)">
      <div class="field">
        <label for="email">Gebruikersnaam of e-mailadres</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Wachtwoord</label>
        <div class="pw-wrap">
          <input type="password" id="password" autocomplete="current-password" required>
          <button type="button" class="pw-eye" onclick="togglePw()" title="Wachtwoord tonen/verbergen">👁</button>
        </div>
      </div>
      <div class="options-row">
        <label class="check-label">
          <input type="checkbox" id="remember"> Ingelogd blijven
        </label>
        <a href="#" class="forgot" onclick="return false">Wachtwoord vergeten?</a>
      </div>
      <button type="submit" class="btn-login" id="btn">Inloggen</button>
    </form>
  </div>

  <script>
    const WORKER = (localStorage.getItem('seminar-worker-url') || '').replace(/\/$/, '');

    function togglePw() {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    }

    async function doLogin(e) {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');

      if (!WORKER) {
        err.textContent = 'Worker URL niet ingesteld. Open eerst de Fincent-app en sla de Worker URL op via Instellingen.';
        err.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Bezig…';
      err.style.display = 'none';

      try {
        const res = await fetch(`${WORKER}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        if (!res.ok) {
          err.textContent = 'E-mailadres of wachtwoord is onjuist.';
          err.style.display = 'block';
          return;
        }

        const { token } = await res.json();
        const store = remember ? localStorage : sessionStorage;
        store.setItem('ai_token', token);
        store.setItem('ai_email', email);
        window.location.href = '/testing/ai.html';
      } catch {
        err.textContent = 'Verbindingsfout. Controleer je internetverbinding en probeer opnieuw.';
        err.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Inloggen';
      }
    }
  </script>
</body>
</html>
